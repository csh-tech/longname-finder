name: Build and release

# Runs when you publish a release on GitHub (Releases -> Draft a new release -> Publish).
# The exe is built on GitHub's Windows servers and attached to that release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --console --clean
          --name LongNameFinder
          --icon assets/icon.ico
          --add-data "locales;locales"
          longname_finder.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LongNameFinder
          path: dist/LongNameFinder.exe

      - name: Attach exe to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LongNameFinder.exe
